<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的小网站</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#1a1a2e;
            color:#fff;
            font-family:system-ui, sans-serif;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .box{
            text-align:center;
            padding:30px 40px;
            background:rgba(255,255,255,0.08);
            border-radius:16px;
        }
        h1{margin-bottom:16px;color:#74b9ff;}
        p{opacity:0.8;line-height:1.6;margin-bottom:12px;}
    </style>
</head>
<body>
    <div class="box">
        <h1>欢迎来到我的小站</h1>
        <p>站点正在搭建中</p>
        <p>准备蒙ICP备案</p>
    </div>
</body>
</html>
